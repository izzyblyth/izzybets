function togBook(i){const x=allBooks()[i];if(!x)return;const k=nb(x),H=(S.hid||[]).map(nb);S.hid=H.includes(k)?H.filter(y=>y!==k):[...H,k];save();go()}
function backup(){dl('izzybets-backup-'+todayStr()+'.json',JSON.stringify(S),'application/json')}
function restore(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.bankrolls||!d.bets)throw 0;S=d;save();go();toast('Backup restored')}catch(e){alert('That file is not a valid IzzyBets backup.')}})}
function demo(){const b=S.bankrolls[0];for(let i=0;i<40;i++){const o=+(1.6+Math.random()*1.6).toFixed(2),r=Math.random(),d=new Date(Date.now()-i*3*864e5).toISOString().slice(0,16);S.bets.push({id:uid(),bank:b.id,type:'Single',sport:SPORTS[i%5],league:'',event:'Demo '+i,team:'',market:'Moneyline',selection:'Demo pick '+i,odds:o,stake:10,uv:10,date:d,status:i<2?'Pending':r<.45?'Won':r<.5?'Void':r<.55?'Half Won':'Lost',notes:''})}save();go()}
